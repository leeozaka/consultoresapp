apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  labels:
    app: redisinsight
    app.kubernetes.io/name: redisinsight
    app.kubernetes.io/component: tooling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5540
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5540
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5540
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: redisinsight-data
              mountPath: /data
      volumes:
        - name: redisinsight-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  labels:
    app: redisinsight
    app.kubernetes.io/name: redisinsight
    app.kubernetes.io/component: tooling
spec:
  selector:
    app: redisinsight
  ports:
    - name: http
      port: 5540
      targetPort: 5540
  type: ClusterIP
