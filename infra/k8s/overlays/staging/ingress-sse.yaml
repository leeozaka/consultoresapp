apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consultores-sse
  namespace: consultores-staging
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # SSE connections must stay open for minutes/hours — override the 60s default.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # Disable response buffering so SSE frames are flushed to the client immediately.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Force HTTP/1.1 to upstream — required for chunked SSE over keep-alive.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - staging.consultor.app
        - api.staging.consultor.app
        - demo.staging.consultor.app
        - acme.staging.consultor.app
      secretName: staging-consultor-app-tls

  rules:
    - host: staging.consultor.app
      http: &sse-paths
        paths:
          - path: /api/tenant/payments/events
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /api/admin/payments/events
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080

    - host: demo.staging.consultor.app
      http: *sse-paths

    - host: acme.staging.consultor.app
      http: *sse-paths

    - host: api.staging.consultor.app
      http:
        paths:
          - path: /api/tenant/payments/events
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /api/admin/payments/events
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
