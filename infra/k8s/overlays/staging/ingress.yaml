apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consultores-staging
  namespace: consultores-staging
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - staging.consultor.app
        - api.staging.consultor.app
        - demo.staging.consultor.app
        - acme.staging.consultor.app
      secretName: staging-consultor-app-tls

  rules:
    # ── Staging dashboard (root) ─────────────────────────────────────────────
    - host: staging.consultor.app
      http: &staging-paths
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /connect
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 4000

    # ── Staging API subdomain ──────────────────────────────────────────────────
    - host: api.staging.consultor.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080

    # ── Staging tenant-demo ────────────────────────────────────────────────────
    - host: demo.staging.consultor.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /connect
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenant-demo
                port:
                  number: 4000

    # ── Staging tenant-acme ────────────────────────────────────────────────────
    - host: acme.staging.consultor.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /connect
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenant-acme
                port:
                  number: 4000

    # ── Staging tenant subdomains — uncomment after DNS-01 wildcard TLS ────────
    # - host: "*.staging.consultor.app"
    #   http: *staging-paths
