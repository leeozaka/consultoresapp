# LocalStack (S3-compatible) for local R2 storage emulation.
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: consultores
  labels:
    app: localstack
spec:
  selector:
    app: localstack
  ports:
    - name: gateway
      port: 4566
      targetPort: 4566
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: consultores
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "s3"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: PERSISTENCE
              value: "1"
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
            - name: localstack-init
              mountPath: /etc/localstack/init/ready.d/init-s3.sh
              subPath: init-s3.sh
      volumes:
        - name: localstack-data
          emptyDir: {}
        - name: localstack-init
          configMap:
            name: localstack-init
            defaultMode: 0755
