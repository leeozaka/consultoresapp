# Production API — 2 replicas, topology spread, full resource limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  template:
    spec:
      imagePullSecrets:
        - name: docr-credentials

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api

      containers:
        - name: api
          imagePullPolicy: Always

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: ConnectionStrings__ReadConnection
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: ConnectionStrings__ReadConnection
            - name: SuperAdmin__Email
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: SuperAdmin__Email
            - name: SuperAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: SuperAdmin__Password
            - name: R2__AccountId
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__AccountId
            - name: R2__AccessKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__AccessKey
            - name: R2__SecretKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__SecretKey
            - name: R2__BucketName
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__BucketName
            - name: R2__PublicBaseUrl
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__PublicBaseUrl
            - name: OPENIDDICT_SIGNING_CERT_PFX_B64
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: OPENIDDICT_SIGNING_CERT_PFX_B64
            - name: OPENIDDICT_ENCRYPTION_CERT_PFX_B64
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: OPENIDDICT_ENCRYPTION_CERT_PFX_B64
            # Override the ConfigMap's ConnectionStrings__Redis with the
            # password-bearing connection string stored in the secret.
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: ConnectionStrings__Redis

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
