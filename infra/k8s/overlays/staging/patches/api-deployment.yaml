# Staging API — 1 replica, production-like config, sandbox mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: docr-credentials
      containers:
        - name: api
          imagePullPolicy: Always

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: ConnectionStrings__ReadConnection
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: ConnectionStrings__ReadConnection
            - name: SuperAdmin__Email
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: SuperAdmin__Email
            - name: SuperAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: SuperAdmin__Password
            - name: R2__AccountId
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__AccountId
            - name: R2__AccessKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__AccessKey
            - name: R2__SecretKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__SecretKey
            - name: R2__BucketName
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__BucketName
            - name: R2__PublicBaseUrl
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__PublicBaseUrl
            - name: OPENIDDICT_SIGNING_CERT_PFX_B64
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: OPENIDDICT_SIGNING_CERT_PFX_B64
            - name: OPENIDDICT_ENCRYPTION_CERT_PFX_B64
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: OPENIDDICT_ENCRYPTION_CERT_PFX_B64

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
