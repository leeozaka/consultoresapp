apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/assignment
                    operator: In
                    values:
                      - frontend
      tolerations:
        - key: node.kubernetes.io/assignment
          operator: Equal
          value: frontend
          effect: NoSchedule
      imagePullSecrets:
        - name: docr-credentials

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dashboard

      containers:
        - name: dashboard
          imagePullPolicy: Always
          env:
            - name: SSR_API_ORIGIN
              value: "http://api:8080"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
