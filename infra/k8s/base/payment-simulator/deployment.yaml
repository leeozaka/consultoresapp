apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-simulator
  labels:
    app: payment-simulator
    app.kubernetes.io/name: payment-simulator
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-simulator
  template:
    metadata:
      labels:
        app: payment-simulator
    spec:
      containers:
        - name: payment-simulator
          image: consultores-payment-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: Stripe__WebhookSecret
                  optional: true
            - name: CALLBACK_URL
              value: "http://api:8080/api/webhooks/stripe"
            - name: SUCCESS_RATE
              value: "0.9"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"

      restartPolicy: Always
