apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "waiting for rabbitmq..."; sleep 2; done']
      containers:
        - name: api
          image: consultores-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: consultores-config

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: ConnectionStrings__ReadConnection
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: ConnectionStrings__ReadConnection
            - name: SuperAdmin__Email
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: SuperAdmin__Email
            - name: SuperAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: SuperAdmin__Password
            - name: R2__AccountId
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__AccountId
            - name: R2__AccessKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__AccessKey
            - name: R2__SecretKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__SecretKey
            - name: R2__BucketName
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__BucketName
            - name: R2__PublicBaseUrl
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: R2__PublicBaseUrl
            - name: Stripe__SecretKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: Stripe__SecretKey
                  optional: true
            - name: Stripe__BaseUrl
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: Stripe__BaseUrl
                  optional: true
            - name: Stripe__PublishableKey
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: Stripe__PublishableKey
                  optional: true
            - name: Stripe__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: consultores-secrets
                  key: Stripe__WebhookSecret
                  optional: true

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      restartPolicy: Always
