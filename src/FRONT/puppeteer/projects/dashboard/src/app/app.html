@if (devLabel) {
    <output class="fixed inset-x-0 top-0 flex h-8 w-full items-center justify-center gap-2 px-4 text-xs font-semibold text-white"
      style="z-index: 2147483647; background: #16a34a; letter-spacing: 0.04em"
      aria-label="Development environment indicator">
    <span class="inline-block size-1.5 animate-pulse rounded-full bg-white opacity-75"
          aria-hidden="true"></span>
    {{ devLabel }} Environment — Not for production use
  </output>

  <div class="pt-8 dev-label-offset-root">
    <router-outlet />
    <app-toast />
  </div>
} @else {
  <router-outlet />
  <app-toast />
}
